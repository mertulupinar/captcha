<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f7f8fc">
    <title>Güvenlik doğrulaması</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18243a;
        background: #f7f8fc;
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main {
        box-sizing: border-box;
        width: min(100% - 32px, 440px);
        padding: 28px 22px;
        border: 1px solid #e1e6ef;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(24 36 58 / 8%);
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 1.35rem; }
      p { margin: 0 0 20px; line-height: 1.5; color: #4d5b72; }
      #captcha { display: flex; justify-content: center; min-height: 78px; }
      #status { min-height: 24px; margin-top: 14px; font-size: .95rem; }
      #status.error { color: #a32323; }
      button {
        margin-top: 12px;
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #263f70;
        font: inherit;
        cursor: pointer;
      }
      button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Güvenlik doğrulaması</h1>
      <p>Devam etmek için aşağıdaki hCaptcha doğrulamasını tamamlayın.</p>
      <div id="captcha" aria-live="polite"></div>
      <div id="status" role="status" aria-live="polite">Doğrulama yükleniyor…</div>
      <button id="retry" type="button" hidden onclick="window.location.reload()">Yeniden dene</button>
    </main>
    <script>
      (() => {
        const sitekey = 'fadc8d56-23d4-4afc-b78e-1c4ab224f052';
        const status = document.getElementById('status');
        const retry = document.getElementById('retry');
        let widgetId = null;
        let completed = false;

        function showError(message, type = 'error') {
          status.textContent = message;
          status.className = 'error';
          retry.hidden = false;
          if (window.Captcha && typeof window.Captcha.postMessage === 'function') {
            window.Captcha.postMessage(JSON.stringify({ type }));
          }
        }

        window.onHcaptchaLoaded = () => {
          try {
            widgetId = hcaptcha.render('captcha', {
              sitekey,
              callback(token) {
                if (completed || typeof token !== 'string' || token.length === 0) return;
                completed = true;
                status.textContent = 'Doğrulama tamamlandı. Uygulamaya dönülüyor…';
                if (!window.Captcha || typeof window.Captcha.postMessage !== 'function') {
                  showError('Uygulama kanalı bulunamadı. Sayfayı uygulama içinden açıp yeniden deneyin.');
                  return;
                }
                window.Captcha.postMessage(JSON.stringify({ type: 'success', token }));
              },
              'expired-callback'() {
                completed = false;
                showError('Doğrulamanın süresi doldu. Yeniden deneyin.', 'expired');
              },
              'error-callback'() {
                completed = false;
                showError('Doğrulama yüklenemedi. İnternet bağlantınızı kontrol edip yeniden deneyin.');
              },
            });
            status.textContent = 'Robot olmadığınızı doğrulayın.';
          } catch (_) {
            showError('Doğrulama başlatılamadı. Yeniden deneyin.');
          }
        };

        window.addEventListener('load', () => {
          window.setTimeout(() => {
            if (widgetId === null && typeof window.hcaptcha === 'undefined') {
              showError('hCaptcha yüklenemedi. İnternet bağlantınızı kontrol edip yeniden deneyin.');
            }
          }, 12000);
        }, { once: true });
      })();
    </script>
    <script src="https://js.hcaptcha.com/1/api.js?onload=onHcaptchaLoaded&render=explicit" async defer></script>
  </body>
</html>
